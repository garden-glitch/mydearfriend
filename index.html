<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 학급 마니또 뽑기 </title>
  <!-- 구글 웹폰트: Jua & Gowun Dodum -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --secondary: #ec4899;
      --secondary-hover: #db2777;
      --accent-yellow: #f59e0b;
      --bg: #fff5f8;
      --card-bg: #ffffff;
      --text: #334155;
      --text-muted: #64748b;
      --border: #f1f5f9;
      --danger: #ef4444;
      --pastel-purple: #f3e8ff;
      --pastel-pink: #fce7f3;
      --pastel-yellow: #fef3c7;
      --pastel-blue: #e0f2fe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Jua', 'Gowun Dodum', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 50%, #e0f2fe 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(139, 92, 246, 0.12), 0 8px 16px rgba(0, 0, 0, 0.04);
      border: 4px solid #ffffff;
      padding: 40px 32px;
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .title {
      font-size: 1.85rem;
      font-weight: 400;
      text-align: center;
      color: #7c3aed;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 0px #f3e8ff;
    }

    .subtitle {
      font-size: 1rem;
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-family: 'Gowun Dodum', sans-serif;
      font-weight: bold;
    }

    .step { display: none; }
    .step.active { display: block; animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .btn-group { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
    .btn-row { display: flex; gap: 10px; }
    
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 20px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
